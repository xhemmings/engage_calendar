<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Engagement Calendar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef0f3; min-height: 100vh; display: flex; flex-direction: column; }

        /* ── Nav ── */
        nav { background: #1a1f36; color: #fff; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 58px; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-size: 1rem; font-weight: 700; }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-link { color: #a0a8d0; text-decoration: none; font-size: .85rem; padding: 7px 12px; border-radius: 6px; transition: background .15s, color .15s; display: flex; align-items: center; gap: 5px; }
        .nav-link:hover { background: rgba(255,255,255,.1); color: #fff; }
        .nav-link.active { background: rgba(255,255,255,.15); color: #fff; }
        .nav-btn-logout { background: rgba(229,57,53,.2); color: #ef9a9a; border: 1px solid rgba(229,57,53,.3); padding: 7px 12px; border-radius: 6px; font-size: .85rem; cursor: pointer; }
        .nav-btn-logout:hover { background: rgba(229,57,53,.4); color: #fff; }

        /* ── Layout ── */
        .layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; }
        .main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
        .sidebar { display: flex; flex-direction: column; gap: 16px; }

        /* ── Summary cards ── */
        .summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .summary-card { background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .sc-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .8px; color: #999; font-weight: 700; margin-bottom: 10px; }
        .sc-value { font-size: 1.6rem; font-weight: 800; color: #1a1f36; line-height: 1; margin-bottom: 6px; }
        .sc-items { font-size: .8rem; color: #666; line-height: 1.6; }
        .sc-items span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ── Section header ── */
        .section-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .section-hdr h2 { font-size: .95rem; font-weight: 700; color: #1a1f36; }
        .section-hdr a { font-size: .8rem; color: #6b7280; text-decoration: none; }
        .section-hdr a:hover { color: #1a1f36; }

        /* ── Weekly view ── */
        .weekly-panel { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
        .week-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #eee; }
        .week-nav-btn { background: #f0f0f0; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: .85rem; color: #444; transition: background .15s; }
        .week-nav-btn:hover { background: #e0e0e0; }
        .week-label { font-size: .9rem; font-weight: 600; color: #1a1f36; }
        .week-grid { display: grid; grid-template-columns: repeat(7,1fr); border-left: 1px solid #e5e7eb; }
        .week-col { border-right: 1px solid #e5e7eb; min-height: 140px; }
        .week-col-hdr { padding: 8px 6px; text-align: center; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
        .week-col-hdr .day-name { font-size: .68rem; font-weight: 700; text-transform: uppercase; color: #9ca3af; }
        .week-col-hdr .day-num  { font-size: 1.1rem; font-weight: 700; color: #374151; margin-top: 2px; }
        .week-col-hdr.today .day-num { background: #1a1f36; color: #fff; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; margin: 2px auto 0; }
        .week-col-hdr.weekend { background: #f5f5f5; }
        .week-col-body { padding: 6px 5px; display: flex; flex-direction: column; gap: 3px; }
        .week-ev { font-size: .72rem; padding: 3px 6px; border-radius: 3px; background: #e8f5e9; color: #1b5e20; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: space-between; gap: 3px; }
        .week-ev.holiday { background: #ffebee; color: #b71c1c; }
        .week-ev.birthday { background: #fffde7; color: #827717; }
        .week-ev-del { background: none; border: none; color: inherit; opacity: 0; cursor: pointer; padding: 0 2px; font-size: .7rem; flex-shrink: 0; }
        .week-ev:hover .week-ev-del { opacity: 0.6; }
        .week-ev-del:hover { opacity: 1 !important; }
        .week-add-btn { margin: 4px 5px; font-size: .7rem; color: #93c5fd; background: none; border: 1px dashed #bfdbfe; border-radius: 3px; padding: 3px 6px; cursor: pointer; width: calc(100% - 10px); text-align: center; }
        .week-add-btn:hover { background: #eff6ff; }
        .week-col.past .week-col-hdr { opacity: .5; }
        .week-col.past .week-col-body { opacity: .55; }

        /* ── Activity feed ── */
        .activity-panel { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
        .feed-item { display: flex; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #f5f5f5; align-items: flex-start; }
        .feed-item:last-child { border-bottom: none; }
        .feed-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; color: #fff; flex-shrink: 0; }
        .feed-body { flex: 1; min-width: 0; }
        .feed-who  { font-size: .83rem; font-weight: 600; color: #1a1f36; }
        .feed-text { font-size: .82rem; color: #555; margin-top: 1px; }
        .feed-meta { font-size: .74rem; color: #aaa; margin-top: 3px; }
        .feed-empty { padding: 28px; text-align: center; color: #ccc; font-size: .88rem; }

        /* ── Sidebar panels ── */
        .sidebar-panel { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); padding: 18px 16px; }
        .sidebar-panel h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .8px; color: #999; font-weight: 700; margin-bottom: 14px; }
        .sidebar-item { padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: .83rem; color: #444; }
        .sidebar-item:last-child { border-bottom: none; }
        .sidebar-item .si-date { font-size: .74rem; color: #aaa; margin-bottom: 1px; }
        .sidebar-item .si-name { font-weight: 500; color: #1a1f36; }

        /* ── Quick-add form ── */
        .quick-add { display: flex; flex-direction: column; gap: 8px; }
        .quick-add input, .quick-add select { width: 100%; padding: 9px 10px; border: 1.5px solid #e0e0e0; border-radius: 7px; font-size: .85rem; outline: none; transition: border-color .15s; }
        .quick-add input:focus, .quick-add select:focus { border-color: #1a1f36; }
        .quick-add button { padding: 10px; background: #1a1f36; color: #fff; border: none; border-radius: 7px; font-size: .85rem; font-weight: 600; cursor: pointer; }
        .quick-add button:hover { background: #2d3561; }
        #qa-status { font-size: .78rem; color: #22c55e; min-height: 16px; }

        /* ── Mobile ── */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; padding: 14px; }
            .summary-row { grid-template-columns: 1fr 1fr; }
            .week-grid { grid-template-columns: repeat(7,1fr); }
            .week-col-hdr .day-name { font-size: .58rem; }
            .week-col-hdr .day-num  { font-size: .9rem; }
            .week-col-body { padding: 3px 2px; }
            .week-ev { font-size: .63rem; padding: 2px 3px; }
            .week-add-btn { font-size: .63rem; }
        }
        @media (max-width: 600px) {
            .summary-row { grid-template-columns: 1fr; }
            nav { padding: 0 14px; }
            .nav-link { padding: 6px 8px; font-size: .78rem; }
        }
    </style>
</head>
<body>

<nav>
    <span class="nav-brand">Engagement Calendar — Admin</span>
    <div class="nav-links">
        <a href="/calendar.html" class="nav-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home
        </a>
        <a href="/admin.html" class="nav-link active">&#9881; Dashboard</a>
        <a href="/users.html" class="nav-link" id="nav-users" style="display:none">&#128100; Users</a>
        <button class="nav-btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="layout">
    <div class="main">

        <!-- Summary cards -->
        <div>
            <div class="section-hdr"><h2>Overview</h2></div>
            <div class="summary-row" id="summary-row">
                <div class="summary-card"><div class="sc-label">🎂 Birthdays This Month</div><div class="sc-value" id="sc-bd-count">—</div><div class="sc-items" id="sc-bd-list"></div></div>
                <div class="summary-card"><div class="sc-label">📅 This Week</div><div class="sc-value" id="sc-tw-count">—</div><div class="sc-items" id="sc-tw-list"></div></div>
                <div class="summary-card"><div class="sc-label">📅 Next Week</div><div class="sc-value" id="sc-nw-count">—</div><div class="sc-items" id="sc-nw-list"></div></div>
            </div>
        </div>

        <!-- Weekly calendar -->
        <div class="weekly-panel">
            <div class="week-nav">
                <button class="week-nav-btn" onclick="shiftWeek(-1)">&#8592; Prev</button>
                <span class="week-label" id="week-label"></span>
                <button class="week-nav-btn" onclick="shiftWeek(1)">Next &#8594;</button>
            </div>
            <div class="week-grid" id="week-grid"></div>
        </div>

        <!-- Activity feed -->
        <div class="activity-panel">
            <div class="section-hdr" style="padding:16px 18px 0">
                <h2>Activity Feed</h2>
                <a href="#" onclick="loadActivity();return false;">Refresh</a>
            </div>
            <div id="activity-feed"></div>
        </div>

    </div>

    <!-- Sidebar -->
    <div class="sidebar">

        <!-- Quick Add -->
        <div class="sidebar-panel">
            <h3>Quick Add Event</h3>
            <div class="quick-add">
                <input type="date" id="qa-date" />
                <input type="text" id="qa-name" placeholder="Event name" />
                <button onclick="quickAdd()">Add to Calendar</button>
                <div id="qa-status"></div>
            </div>
        </div>

        <!-- Upcoming birthdays -->
        <div class="sidebar-panel">
            <h3>Upcoming Birthdays</h3>
            <div id="sidebar-birthdays"><div style="color:#ccc;font-size:.83rem">Loading…</div></div>
        </div>

        <!-- Registered users -->
        <div class="sidebar-panel">
            <h3>Team Members</h3>
            <div id="sidebar-users"><div style="color:#ccc;font-size:.83rem">Loading…</div></div>
        </div>

    </div>
</div>

<script>
const TODAY   = new Date();
const DAYS    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const COLORS  = ['#1a1f36','#e91e63','#9c27b0','#f44336','#ff9800','#009688','#8bc34a','#ffc107'];

let calendarData  = {};
let birthdayEvents = [];
let weekOffset    = 0; // weeks from current week

function colorFor(name) { let h=0; for(let c of name||'') h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[h]; }
function formatShort(dateStr) { const d=new Date(dateStr+'T00:00:00'); return d.toLocaleString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}); }
function isHoliday(ev) { return ev.name !== 'Placeholder Event' && ev.name.toLowerCase().includes('day'); }

// ── Auth ──────────────────────────────────────────────────────────────────────
fetch('/api/auth-status').then(r=>r.json()).then(d => {
    if (!d.authenticated) { location.href='/login.html'; return; }
    if (!['admin','superadmin'].includes(d.role)) { location.href='/calendar.html'; return; }
    if (d.role === 'superadmin') document.getElementById('nav-users').style.display='inline-flex';
});
async function logout() { await fetch('/api/logout',{method:'POST'}); location.href='/login.html'; }

// ── Load all data ─────────────────────────────────────────────────────────────
async function init() {
    const [calRes, bdRes] = await Promise.all([fetch('/api/calendar'), fetch('/api/birthdays')]);
    calendarData   = await calRes.json();
    birthdayEvents = await bdRes.json();
    buildSummary();
    renderWeek();
    loadActivity();
    loadSidebarBirthdays();
    loadSidebarUsers();
}

// ── Summary cards ─────────────────────────────────────────────────────────────
function buildSummary() {
    const now      = new Date();
    const thisMon  = new Date(now); thisMon.setDate(now.getDate() - now.getDay() + 1);
    const nextMon  = new Date(thisMon); nextMon.setDate(thisMon.getDate() + 7);
    const nextSun  = new Date(nextMon);  nextSun.setDate(nextMon.getDate() + 6);

    const allEvs = [];
    Object.values(calendarData).forEach(m => (m.events||[]).forEach(e => allEvs.push(e)));
    birthdayEvents.forEach(b => allEvs.push({...b, isBirthday:true}));

    // Birthdays this month
    const bdThisMonth = birthdayEvents.filter(b => {
        const d = new Date(b.date+'T00:00:00');
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    });
    document.getElementById('sc-bd-count').textContent = bdThisMonth.length;
    document.getElementById('sc-bd-list').innerHTML = bdThisMonth.slice(0,3).map(b =>
        `<span>${b.name.replace("'s Birthday",'')}: ${formatShort(b.date)}</span>`
    ).join('') || '<span style="color:#ccc">None this month</span>';

    // This week
    const twEvs = allEvs.filter(e => {
        const d = new Date(e.date+'T00:00:00');
        return d >= thisMon && d <= new Date(thisMon.getTime() + 6*86400000);
    });
    document.getElementById('sc-tw-count').textContent = twEvs.length;
    document.getElementById('sc-tw-list').innerHTML = twEvs.slice(0,3).map(e =>
        `<span>${formatShort(e.date)}: ${e.name}</span>`
    ).join('') || '<span style="color:#ccc">No events</span>';

    // Next week
    const nwEvs = allEvs.filter(e => {
        const d = new Date(e.date+'T00:00:00');
        return d >= nextMon && d <= nextSun;
    });
    document.getElementById('sc-nw-count').textContent = nwEvs.length;
    document.getElementById('sc-nw-list').innerHTML = nwEvs.slice(0,3).map(e =>
        `<span>${formatShort(e.date)}: ${e.name}</span>`
    ).join('') || '<span style="color:#ccc">No events</span>';
}

// ── Weekly view ───────────────────────────────────────────────────────────────
function getWeekStart(offset) {
    const d = new Date(TODAY);
    const day = d.getDay(); // 0=Sun
    d.setDate(d.getDate() - day + 1 + offset * 7); // Monday
    d.setHours(0,0,0,0);
    return d;
}

function shiftWeek(dir) { weekOffset += dir; renderWeek(); }

function renderWeek() {
    const mon = getWeekStart(weekOffset);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    document.getElementById('week-label').textContent =
        `${mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${sun.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;

    // Build event map
    const evMap = {};
    Object.values(calendarData).forEach(m => (m.events||[]).forEach(e => {
        if (!evMap[e.date]) evMap[e.date] = [];
        evMap[e.date].push(e);
    }));
    birthdayEvents.forEach(b => {
        if (!evMap[b.date]) evMap[b.date] = [];
        evMap[b.date].push({...b, isBirthday:true});
    });

    const grid = document.getElementById('week-grid');
    grid.innerHTML = '';

    for (let i=0; i<7; i++) {
        const d = new Date(mon); d.setDate(mon.getDate() + i);
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const isToday = d.toDateString() === TODAY.toDateString();
        const isWknd  = d.getDay()===0||d.getDay()===6;
        const isPast  = d < new Date(TODAY.toDateString());
        const dayEvs  = evMap[dateStr] || [];

        const col = document.createElement('div');
        col.className = `week-col${isPast?' past':''}`;

        const hdrCls = `week-col-hdr${isToday?' today':''}${isWknd?' weekend':''}`;
        col.innerHTML = `<div class="${hdrCls}">
            <div class="day-name">${DAYS[d.getDay()]}</div>
            <div class="day-num">${d.getDate()}</div>
        </div>
        <div class="week-col-body" id="wcol-${dateStr}">
            ${dayEvs.map((ev,idx) => `
                <div class="week-ev ${ev.isBirthday?'birthday':isHoliday(ev)?'holiday':''}" title="${ev.name}">
                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ev.name}</span>
                    <button class="week-ev-del" onclick="weekDelEvent('${dateStr}','${ev.name.replace(/'/g,"\\'")}',this)" title="Remove">✕</button>
                </div>`).join('')}
            <button class="week-add-btn" onclick="weekAddPrompt('${dateStr}')">+ add</button>
        </div>`;
        grid.appendChild(col);
    }
}

async function weekAddPrompt(dateStr) {
    const name = prompt(`Add event on ${formatShort(dateStr)}:`);
    if (!name?.trim()) return;
    // Find which month this date belongs to
    const month = findOrCreateMonth(dateStr);
    calendarData[month].events = calendarData[month].events || [];
    calendarData[month].events.push({ date: dateStr, name: name.trim() });
    calendarData[month].events.sort((a,b) => a.date.localeCompare(b.date));
    await saveCalendar();
    renderWeek(); buildSummary();
}

async function weekDelEvent(dateStr, name, btn) {
    const month = Object.keys(calendarData).find(m => (calendarData[m].events||[]).some(e => e.date===dateStr && e.name===name));
    if (!month) return;
    calendarData[month].events = calendarData[month].events.filter(e => !(e.date===dateStr && e.name===name));
    await saveCalendar();
    renderWeek(); buildSummary();
}

function findOrCreateMonth(dateStr) {
    // Try to find existing month containing events in the same calendar month
    const [y,m] = dateStr.split('-').map(Number);
    const mName = MONTHS[m-1];
    if (!calendarData[mName]) calendarData[mName] = { color: '#607d8b', events: [] };
    return mName;
}

// ── Quick add ─────────────────────────────────────────────────────────────────
async function quickAdd() {
    const date = document.getElementById('qa-date').value;
    const name = document.getElementById('qa-name').value.trim();
    if (!date || !name) return;
    const month = findOrCreateMonth(date);
    calendarData[month].events = calendarData[month].events || [];
    calendarData[month].events.push({ date, name });
    calendarData[month].events.sort((a,b) => a.date.localeCompare(b.date));
    await saveCalendar();
    document.getElementById('qa-name').value = '';
    document.getElementById('qa-status').textContent = '✓ Added';
    setTimeout(() => document.getElementById('qa-status').textContent = '', 2000);
    renderWeek(); buildSummary();
}

async function saveCalendar() {
    await fetch('/api/calendar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(calendarData)
    });
}

// ── Activity feed ─────────────────────────────────────────────────────────────
async function loadActivity() {
    const r = await fetch('/api/activity');
    if (!r.ok) return;
    const items = await r.json();
    const feed  = document.getElementById('activity-feed');
    if (!items.length) { feed.innerHTML = '<div class="feed-empty">No activity yet.</div>'; return; }
    feed.innerHTML = items.map(item => {
        const name   = item.first_name ? `${item.first_name} ${item.last_name||''}`.trim() : item.username;
        const avatar = name[0].toUpperCase();
        const color  = colorFor(item.username);
        const date   = new Date(item.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
        if (item.type === 'comment') {
            return `<div class="feed-item">
                <div class="feed-avatar" style="background:${color}">${avatar}</div>
                <div class="feed-body">
                    <div class="feed-who">${name}</div>
                    <div class="feed-text">💬 "${item.body}" on ${formatShort(item.event_key)}</div>
                    <div class="feed-meta">${date}</div>
                </div>
            </div>`;
        } else {
            const emoji = item.reaction === 'like' ? '👍' : '👎';
            return `<div class="feed-item">
                <div class="feed-avatar" style="background:${color}">${avatar}</div>
                <div class="feed-body">
                    <div class="feed-who">${name}</div>
                    <div class="feed-text">${emoji} reacted to ${formatShort(item.event_key)}</div>
                    <div class="feed-meta">${date}</div>
                </div>
            </div>`;
        }
    }).join('');
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function loadSidebarBirthdays() {
    const now   = new Date();
    const sorted = [...birthdayEvents].sort((a,b) => {
        const ad = new Date(a.date+'T00:00:00'), bd = new Date(b.date+'T00:00:00');
        const am = (ad - now + 366*86400000) % (366*86400000);
        const bm = (bd - now + 366*86400000) % (366*86400000);
        return am - bm;
    }).slice(0, 6);
    document.getElementById('sidebar-birthdays').innerHTML = sorted.length
        ? sorted.map(b => `<div class="sidebar-item">
            <div class="si-date">${formatShort(b.date)}</div>
            <div class="si-name">🎂 ${b.name.replace("'s Birthday",'').replace('🎂 ','')}</div>
          </div>`).join('')
        : '<div style="color:#ccc;font-size:.83rem">No birthdays on record</div>';
}

async function loadSidebarUsers() {
    const r = await fetch('/api/users');
    if (!r.ok) return;
    const users = await r.json();
    const entries = Object.entries(users);
    document.getElementById('sidebar-users').innerHTML = entries.map(([u, d]) => `
        <div class="sidebar-item">
            <div class="si-date" style="text-transform:capitalize">${d.role}</div>
            <div class="si-name">${d.firstName||''} ${d.lastName||u}</div>
        </div>`).join('');
}

init();
</script>
</body>
</html>
