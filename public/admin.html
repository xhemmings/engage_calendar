<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Engagement Calendar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef0f3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ── */
        nav {
            background: #1a1f36;
            color: #fff;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 58px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.3px; }
        .nav-links { display: flex; align-items: center; gap: 6px; }
        .nav-link {
            color: #a0a8d0;
            text-decoration: none;
            font-size: 0.88rem;
            padding: 7px 14px;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: #fff; }
        .nav-btn-logout {
            background: rgba(229,57,53,0.2);
            color: #ef9a9a;
            border: 1px solid rgba(229,57,53,0.3);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .nav-btn-logout:hover { background: rgba(229,57,53,0.4); color: #fff; }

        /* ── Layout ── */
        .layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 0;
            flex: 1;
            padding: 28px 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* ── Sidebar ── */
        .sidebar {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 20px 14px;
            height: fit-content;
            position: sticky;
            top: 82px;
            margin-right: 24px;
        }
        .sidebar h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-bottom: 14px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.87rem;
            color: #333;
            transition: background 0.12s;
            text-decoration: none;
            margin-bottom: 2px;
        }
        .sidebar-item:hover { background: #f0f0f0; }
        .sidebar-item.active { background: #1a1f36; color: #fff; }
        .sidebar-item.active .dot { background: #fff !important; }
        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sidebar-divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 12px 0;
        }
        .add-month-btn {
            width: 100%;
            padding: 9px;
            background: #1a1f36;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.15s;
        }
        .add-month-btn:hover { background: #2d3561; }

        /* ── Main ── */
        .main { min-width: 0; }
        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a1f36;
            margin-bottom: 6px;
        }
        .page-subtitle {
            font-size: 0.88rem;
            color: #888;
            margin-bottom: 24px;
        }

        /* ── Month grid ── */
        .months-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .month-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
        }
        .month-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.13);
        }
        .month-card.active { outline: 3px solid #1a1f36; }
        .month-card.past { opacity: 0.45; filter: grayscale(0.6); }
        .month-card.past:hover { transform: none; }
        .card-header {
            padding: 14px 16px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .edit-badge {
            background: rgba(255,255,255,0.25);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .card-body { padding: 12px 16px 14px; }
        .card-event-count {
            font-size: 0.78rem;
            color: #888;
            margin-bottom: 8px;
        }
        .event-preview {
            font-size: 0.8rem;
            color: #555;
            padding: 3px 0;
            border-bottom: 1px solid #f5f5f5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .event-preview:last-child { border-bottom: none; }
        .event-preview.holiday { color: #c62828; font-weight: 600; }

        /* ── Admin calendar panel ── */
        .admin-cal-panel { display: none; background: #fff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.1); overflow: hidden; margin-top: 16px; }
        .admin-cal-panel.open { display: block; }
        .acp-header { padding: 14px 20px; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .acp-nav { display: flex; align-items: center; gap: 10px; }
        .acp-nav-btn { background: rgba(255,255,255,.2); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
        .acp-nav-btn:hover { background: rgba(255,255,255,.4); }
        .acp-nav-btn:disabled { opacity: .3; cursor: default; }
        .acp-title { font-size: 1.1rem; font-weight: 700; }
        .acp-close { background: rgba(255,255,255,.2); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: .9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .acp-close:hover { background: rgba(255,255,255,.4); }
        .acp-grid-wrap { padding: 16px 20px 20px; }
        .acp-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
        .acp-day-name { text-align: center; font-size: .7rem; font-weight: 700; color: #bbb; text-transform: uppercase; padding-bottom: 5px; }
        .acp-cell { min-height: 72px; border-radius: 8px; padding: 6px 8px; background: #f8f9fa; position: relative; transition: background .12s; border: 2px solid transparent; }
        .acp-cell.empty { background: transparent; border-color: transparent; }
        .acp-cell.weekend { background: #f0f0f0; }
        .acp-cell.has-event { background: #e8f5e9; }
        .acp-cell.clickable { cursor: pointer; }
        .acp-cell.clickable:hover { background: #dbeafe; border-color: #93c5fd; }
        .acp-cell.today .acp-day-num { background: #1a1f36; color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
        .acp-day-num { font-weight: 600; color: #333; font-size: .88rem; margin-bottom: 3px; }
        .acp-ev-tag { display: block; font-size: .68rem; color: #444; background: rgba(0,0,0,.07); border-radius: 3px; padding: 1px 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .acp-add-hint { font-size: .65rem; color: #93c5fd; margin-top: 2px; }

        /* ── Drawer ── */
        .drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 200;
        }
        .drawer-overlay.open { display: block; }
        .drawer {
            position: fixed;
            top: 0;
            right: -520px;
            width: 480px;
            max-width: 95vw;
            height: 100vh;
            background: #fff;
            box-shadow: -4px 0 24px rgba(0,0,0,0.15);
            z-index: 201;
            display: flex;
            flex-direction: column;
            transition: right 0.25s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }
        .drawer.open { right: 0; }

        .drawer-header {
            padding: 20px 24px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .drawer-title { font-size: 1.2rem; font-weight: 700; }
        .drawer-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .drawer-close:hover { background: rgba(255,255,255,0.35); }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Color picker row */
        .color-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 14px 16px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .color-row label { font-size: 0.88rem; font-weight: 600; color: #444; flex: 1; }
        .color-preview {
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 2px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .color-preview:hover { transform: scale(1.1); }
        #drawer-color { width: 0; height: 0; opacity: 0; position: absolute; }

        /* Events section */
        .section-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .event-row {
            display: grid;
            grid-template-columns: 140px 1fr 36px;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            background: #f8f9fa;
            padding: 8px 10px;
            border-radius: 8px;
        }
        .event-row input[type="date"],
        .event-row input[type="text"] {
            border: 1.5px solid #ddd;
            border-radius: 6px;
            padding: 7px 9px;
            font-size: 0.87rem;
            outline: none;
            width: 100%;
            background: #fff;
            transition: border-color 0.15s;
        }
        .event-row input:focus { border-color: #1a1f36; }
        .del-btn {
            width: 32px; height: 32px;
            background: #fdecea;
            color: #c62828;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .del-btn:hover { background: #ffcdd2; }

        .add-event-btn {
            width: 100%;
            padding: 10px;
            background: #fff;
            border: 1.5px dashed #ccc;
            border-radius: 8px;
            color: #888;
            font-size: 0.88rem;
            cursor: pointer;
            margin-top: 4px;
            transition: border-color 0.15s, color 0.15s;
        }
        .add-event-btn:hover { border-color: #1a1f36; color: #1a1f36; }

        /* Drawer footer */
        .drawer-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .btn-save {
            flex: 1;
            padding: 12px;
            background: #1a1f36;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-save:hover { background: #2d3561; }
        .btn-cancel {
            padding: 12px 20px;
            background: #f0f0f0;
            color: #444;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-cancel:hover { background: #e0e0e0; }

        .save-status {
            font-size: 0.82rem;
            color: #388e3c;
            text-align: center;
            padding: 2px 0 0;
            min-height: 18px;
        }

        /* Responsive */
        /* ── Mobile ── */
        @media (max-width: 768px) {
            nav { padding: 0 14px; height: 52px; }
            .nav-brand { font-size: .95rem; }
            .nav-link { padding: 6px 8px; font-size: .76rem; }
            .nav-btn-logout { padding: 6px 8px; font-size: .76rem; }

            .layout { grid-template-columns: 1fr; padding: 12px; }
            .sidebar { display: none; }
            .main { padding: 0; }

            .page-title { font-size: 1.1rem; }
            .page-subtitle { font-size: .8rem; margin-bottom: 16px; }

            /* Month cards 2-up */
            .months-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card-header { padding: 10px 12px; font-size: .88rem; }
            .card-body { padding: 8px 12px 10px; }
            .event-preview { font-size: .74rem; }

            /* Admin calendar panel */
            .admin-cal-panel { margin-top: 12px; border-radius: 8px; }
            .acp-header { padding: 10px 12px; }
            .acp-title { font-size: .95rem; }
            .acp-nav-btn { width: 28px; height: 28px; font-size: .85rem; }
            .acp-grid-wrap { padding: 10px 6px 12px; }
            .acp-grid { gap: 2px; }
            .acp-day-name { font-size: .6rem; padding-bottom: 4px; }
            .acp-cell { min-height: 56px; padding: 4px 3px; }
            .acp-day-num { font-size: .75rem; margin-bottom: 1px; }
            .acp-ev-tag { font-size: .58rem; padding: 1px 3px; }
            .acp-add-hint { display: none; }

            /* Drawer: full screen on mobile */
            .drawer { width: 100vw; max-width: 100vw; }
            .drawer-body { padding: 16px; }
            .drawer-footer { padding: 12px 16px; }

            /* Event rows: stack date above name */
            .event-row {
                grid-template-columns: 1fr 34px;
                grid-template-rows: auto auto;
            }
            .event-row input[type="date"] { grid-column: 1 / 2; }
            .event-row input[type="text"] { grid-column: 1 / 2; }
            .event-row .del-btn { grid-column: 2; grid-row: 1 / 3; align-self: center; }

            .btn-save, .btn-cancel { padding: 12px 10px; font-size: .9rem; }
        }
        @media (max-width: 420px) {
            .months-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>

<!-- Nav -->
<nav>
    <span class="nav-brand">Engagement Calendar 2026</span>
    <div class="nav-links">
        <a href="/calendar.html" class="nav-link">&#128197; Calendar</a>
        <a href="/admin.html" class="nav-link active">&#9998; Admin</a>
        <a href="/users.html" class="nav-link" id="nav-users" style="display:none">&#128100; Users</a>
        <button class="nav-btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<!-- Layout -->
<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h3>Months</h3>
        <div id="sidebar-months"></div>
        <hr class="sidebar-divider">
        <button class="add-month-btn" onclick="addMonth()">+ Add Month</button>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="page-title">Admin Panel</div>
        <div class="page-subtitle">Click any month card to edit events, colours and dates.</div>
        <div class="months-grid" id="months-grid"></div>
        <div class="admin-cal-panel" id="admin-cal-panel"></div>
    </main>
</div>

<!-- Drawer overlay -->
<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>

<!-- Edit Drawer -->
<div class="drawer" id="drawer">
    <div class="drawer-header" id="drawer-header">
        <span class="drawer-title" id="drawer-title">Edit Month</span>
        <button class="drawer-close" onclick="closeDrawer()">&#x2715;</button>
    </div>
    <div class="drawer-body">
        <div class="color-row">
            <label>Card Colour</label>
            <div class="color-preview" id="color-preview" onclick="document.getElementById('drawer-color').click()"></div>
            <input type="color" id="drawer-color" oninput="updateColorPreview(this.value)" />
        </div>
        <div class="section-label">Events</div>
        <div id="events-list"></div>
        <button class="add-event-btn" onclick="addEventRow()">+ Add Event</button>
    </div>
    <div class="drawer-footer">
        <button class="btn-cancel" onclick="closeDrawer()">Cancel</button>
        <button class="btn-save" onclick="saveMonth()">Save Changes</button>
    </div>
    <div class="save-status" id="save-status"></div>
</div>

<script>
let calendarData = {};
let currentMonth = null;

// ── Auth guard ──────────────────────────────────────────────────────────────
fetch('/api/auth-status').then(r => r.json()).then(d => {
    if (!d.authenticated) { window.location.href = '/login.html'; return; }
    if (!['admin','superadmin'].includes(d.role)) { window.location.href = '/calendar.html'; return; }
    if (d.role === 'superadmin') document.getElementById('nav-users').style.display = 'inline-block';
});

async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

// ── Data ────────────────────────────────────────────────────────────────────
async function loadData() {
    const res = await fetch('/api/calendar');
    calendarData = await res.json();
    renderAll();
}

async function persist() {
    const res = await fetch('/api/calendar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(calendarData)
    });
    return res.json();
}

function isHoliday(ev) {
    return ev.name !== 'Placeholder Event' && ev.name.toLowerCase().includes('day');
}
function formatShort(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
}

// ── Render ──────────────────────────────────────────────────────────────────
function renderAll() {
    renderSidebar();
    renderGrid();
}

function renderSidebar() {
    const el = document.getElementById('sidebar-months');
    el.innerHTML = '';
    Object.keys(calendarData).forEach(month => {
        const color = calendarData[month].color || '#007bff';
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (currentMonth === month ? ' active' : '');
        item.id = `sb-${month}`;
        item.innerHTML = `<span class="dot" style="background:${color}"></span>${month}`;
        item.onclick = () => openDrawer(month);
        el.appendChild(item);
    });
}

function renderGrid() {
    const grid = document.getElementById('months-grid');
    grid.innerHTML = '';
    Object.keys(calendarData).forEach(month => {
        const data   = calendarData[month];
        const events = (data.events || []).sort((a,b) => a.date.localeCompare(b.date));
        const card   = document.createElement('div');
        card.className = 'month-card' + (currentMonth === month ? ' active' : '');
        card.id = `card-${month}`;
        const preview = events.slice(0,4).map(ev =>
            `<div class="event-preview ${isHoliday(ev)?'holiday':''}">${formatShort(ev.date)}: ${ev.name}</div>`
        ).join('');
        card.innerHTML = `
            <div class="card-header" style="background:${data.color||'#007bff'}">
                <span>${month}</span><span class="edit-badge">&#9660;</span>
            </div>
            <div class="card-body">
                <div class="card-event-count">${events.length} event${events.length!==1?'s':''}</div>
                ${preview}
                ${events.length>4?`<div class="event-preview" style="color:#aaa">+${events.length-4} more…</div>`:''}
            </div>`;
        card.onclick = () => toggleCalPanel(month);
        grid.appendChild(card);
    });
    // Fade past months
    const now = new Date();
    Object.keys(calendarData).forEach(month => {
        const events = calendarData[month]?.events || [];
        if (!events.length) return;
        const d = new Date(events[0].date + 'T00:00:00');
        const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        document.getElementById(`card-${month}`)?.classList.toggle('past', lastDay < now);
    });
}

// ── Admin calendar panel ──────────────────────────────────────────────────────
const TODAY = new Date();
const monthKeysList = () => Object.keys(calendarData);

function toggleCalPanel(month) {
    if (currentMonth === month) { closeCalPanel(); return; }
    openCalPanel(month);
}

function openCalPanel(month) {
    if (currentMonth) {
        document.getElementById(`card-${currentMonth}`)?.classList.remove('active');
    }
    currentMonth = month;
    document.getElementById(`card-${month}`)?.classList.add('active');
    renderCalPanel(month);
    const panel = document.getElementById('admin-cal-panel');
    panel.classList.add('open');
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeCalPanel() {
    document.getElementById(`card-${currentMonth}`)?.classList.remove('active');
    currentMonth = null;
    const panel = document.getElementById('admin-cal-panel');
    panel.classList.remove('open');
    panel.innerHTML = '';
}

function navigateCalPanel(dir) {
    const keys = monthKeysList();
    const idx  = keys.indexOf(currentMonth);
    const next = keys[idx + dir];
    if (next) openCalPanel(next);
}

function renderCalPanel(month) {
    const panel  = document.getElementById('admin-cal-panel');
    const data   = calendarData[month];
    const events = data.events || [];
    const color  = data.color || '#007bff';
    const keys   = monthKeysList();
    const idx    = keys.indexOf(month);

    // Determine year/month from first event or default
    const ref = events[0] ? new Date(events[0].date+'T00:00:00') : new Date(2026, 0, 1);
    const year = events[0] ? parseInt(events[0].date.split('-')[0]) : 2026;
    const mIdx = events[0] ? parseInt(events[0].date.split('-')[1])-1 : ref.getMonth();
    const daysInMonth = new Date(year, mIdx+1, 0).getDate();
    const firstDow    = new Date(year, mIdx, 1).getDay();

    // Build event map by day
    const evMap = {};
    events.forEach(ev => {
        const d = parseInt(ev.date.split('-')[2]);
        if (!evMap[d]) evMap[d] = [];
        evMap[d].push(ev);
    });

    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let cells = dayNames.map(d => `<div class="acp-day-name">${d}</div>`).join('');
    for (let i=0; i<firstDow; i++) cells += `<div class="acp-cell empty"></div>`;

    for (let d=1; d<=daysInMonth; d++) {
        const dow     = (firstDow+d-1)%7;
        const isWknd  = dow===0||dow===6;
        const dayEvs  = evMap[d]||[];
        const dateStr = `${year}-${String(mIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isTdy   = TODAY.getFullYear()===year && TODAY.getMonth()===mIdx && TODAY.getDate()===d;

        let cls = 'acp-cell clickable';
        if (isWknd)       cls += ' weekend';
        if (dayEvs.length) cls += ' has-event';
        if (isTdy)        cls += ' today';

        const evTags = dayEvs.map(ev =>
            `<span class="acp-ev-tag">${ev.name}</span>`
        ).join('');

        cells += `<div class="${cls}" onclick="openDrawerForDay('${month}','${dateStr}')">
            <div class="acp-day-num">${d}</div>
            ${evTags}
            <span class="acp-add-hint">+ add</span>
        </div>`;
    }

    panel.innerHTML = `
        <div class="acp-header" style="background:${color}">
            <div class="acp-nav">
                <button class="acp-nav-btn" onclick="navigateCalPanel(-1)" ${idx===0?'disabled':''}>&#8592;</button>
                <span class="acp-title">${month} ${year}</span>
                <button class="acp-nav-btn" onclick="navigateCalPanel(1)" ${idx===keys.length-1?'disabled':''}>&#8594;</button>
            </div>
            <button class="acp-close" onclick="closeCalPanel()">&#x2715;</button>
        </div>
        <div class="acp-grid-wrap">
            <div class="acp-grid">${cells}</div>
        </div>`;
}

function openDrawerForDay(month, dateStr) {
    currentEditMonth = month;
    const data  = calendarData[month];
    document.getElementById('modal-title').textContent = `Edit — ${month}`;
    document.getElementById('drawer-header').style.background = data.color || '#007bff';
    document.getElementById('drawer-color').value = data.color || '#007bff';
    document.getElementById('color-preview').style.background = data.color || '#007bff';
    document.getElementById('save-status').textContent = '';

    const list   = document.getElementById('events-list');
    list.innerHTML = '';

    // Show existing events for this day
    const dayEvs = (data.events||[]).filter(e => e.date === dateStr).sort((a,b)=>a.date.localeCompare(b.date));
    dayEvs.forEach(ev => addEventRow(ev.date, ev.name));

    // Always add a blank row pre-filled with the clicked date
    addEventRow(dateStr, '');

    document.getElementById('overlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');

    // Focus the new event name field
    setTimeout(() => {
        const inputs = list.querySelectorAll('input[type="text"]');
        if (inputs.length) inputs[inputs.length-1].focus();
    }, 50);
}

// ── Drawer ──────────────────────────────────────────────────────────────────
function openDrawer(month) {
    currentMonth = month;
    const data = calendarData[month];

    document.getElementById('drawer-title').textContent = `Edit — ${month}`;
    document.getElementById('drawer-header').style.background = data.color || '#007bff';
    document.getElementById('drawer-color').value = data.color || '#007bff';
    document.getElementById('color-preview').style.background = data.color || '#007bff';
    document.getElementById('save-status').textContent = '';

    const list = document.getElementById('events-list');
    list.innerHTML = '';
    (data.events || []).sort((a, b) => a.date.localeCompare(b.date)).forEach(ev => addEventRow(ev.date, ev.name));

    document.getElementById('overlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');

    // Highlight active card and sidebar item
    renderAll();
}

function closeDrawer() {
    currentMonth = null;
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
    renderAll();
}

function updateColorPreview(val) {
    document.getElementById('color-preview').style.background = val;
    document.getElementById('drawer-header').style.background = val;
}

function addEventRow(dateVal = '', nameVal = '') {
    const list = document.getElementById('events-list');
    const row = document.createElement('div');
    row.className = 'event-row';
    row.innerHTML = `
        <input type="date" value="${dateVal}" />
        <input type="text" placeholder="Event name" value="${nameVal}" />
        <button class="del-btn" title="Remove">&#x2715;</button>`;
    row.querySelector('.del-btn').onclick = () => list.removeChild(row);
    list.appendChild(row);
}

async function saveMonth() {
    if (!currentMonth) return;
    const color = document.getElementById('drawer-color').value;
    const rows  = document.querySelectorAll('#events-list .event-row');
    const events = [];
    rows.forEach(row => {
        const date = row.querySelector('input[type="date"]').value;
        const name = row.querySelector('input[type="text"]').value.trim();
        if (date && name) events.push({ date, name });
    });
    calendarData[currentMonth] = { color, events: events.sort((a, b) => a.date.localeCompare(b.date)) };

    const btn = document.querySelector('.btn-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const result = await persist();
    btn.disabled = false;
    btn.textContent = 'Save Changes';

    if (result.ok) {
        document.getElementById('save-status').textContent = '✓ Saved successfully';
        renderAll();
        document.getElementById('drawer-header').style.background = color;
        // Refresh the calendar panel if open for this month
        if (currentMonth === currentEditMonth) renderCalPanel(currentMonth);
    } else {
        document.getElementById('save-status').style.color = '#c62828';
        document.getElementById('save-status').textContent = 'Save failed — please try again';
    }
}

// ── Add month ────────────────────────────────────────────────────────────────
function addMonth() {
    const name = prompt('Month name (e.g. "January"):');
    if (!name || !name.trim()) return;
    const key = name.trim();
    if (calendarData[key]) { alert('That month already exists.'); return; }
    calendarData[key] = { color: '#607d8b', events: [] };
    renderAll();
    openDrawer(key);
}

loadData();
</script>
