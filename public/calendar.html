<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engagement Calendar 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef0f3; min-height: 100vh; display: flex; flex-direction: column; }

        /* ── Nav ── */
        header { background: #1a1f36; color: #fff; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 58px; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.1rem; font-weight: 700; }
        .nav-links { display: flex; align-items: center; gap: 6px; }
        .nav-link { color: #a0a8d0; text-decoration: none; font-size: .88rem; padding: 7px 14px; border-radius: 6px; transition: background .15s, color .15s; }
        .nav-link:hover { background: rgba(255,255,255,.1); color: #fff; }
        .nav-link.active { background: rgba(255,255,255,.15); color: #fff; }
        .nav-btn-logout { background: rgba(229,57,53,.2); color: #ef9a9a; border: 1px solid rgba(229,57,53,.3); padding: 7px 14px; border-radius: 6px; font-size: .88rem; cursor: pointer; }
        .nav-btn-logout:hover { background: rgba(229,57,53,.4); color: #fff; }

        /* ── Layout ── */
        .layout { display: grid; grid-template-columns: 200px 1fr 220px; gap: 0; flex: 1; padding: 28px 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* ── Wells ── */
        .well { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); padding: 20px 16px; position: sticky; top: 82px; max-height: calc(100vh - 110px); display: flex; flex-direction: column; }
        .well h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; color: #999; margin-bottom: 14px; flex-shrink: 0; }
        .well-scroll { overflow-y: auto; flex: 1; padding-right: 2px; }
        .well-scroll::-webkit-scrollbar { width: 4px; }
        .well-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: .84rem; color: #444; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
        .month-nav-link { display: flex; align-items: center; gap: 8px; font-size: .84rem; color: #333; text-decoration: none; padding: 5px 7px; border-radius: 6px; transition: background .12s; margin-bottom: 2px; cursor: pointer; }
        .month-nav-link:hover { background: #f0f0f0; }
        .month-nav-link.active { background: #1a1f36; color: #fff; }
        .month-nav-link.active .mnl-dot { background: #fff !important; }
        .mnl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

        /* Right well */
        .upcoming-event { padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: .82rem; cursor: pointer; }
        .upcoming-event:last-child { border-bottom: none; }
        .upcoming-event:hover .ev-name { color: #1a1f36; }
        .ev-date { color: #aaa; font-size: .74rem; margin-bottom: 1px; }
        .ev-name  { color: #333; font-weight: 500; }
        .ev-dot   { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

        /* Mobile events accordion */
        .mobile-events-section { display: none; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); margin-top: 20px; overflow: hidden; }
        .mobile-events-toggle { padding: 14px 16px; font-size: .88rem; font-weight: 600; color: #1a1f36; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: none; background: none; width: 100%; text-align: left; }
        .mobile-events-list { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
        .mobile-events-list.open { max-height: 400px; overflow-y: auto; }
        .mobile-events-list .upcoming-event { padding: 8px 16px; }

        /* ── Main ── */
        .main { padding: 0 24px; min-width: 0; }
        .months-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }

        /* ── Month card ── */
        .month-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.08); overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; }
        .month-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
        .month-card.active { box-shadow: 0 6px 22px rgba(26,31,54,.18); transform: translateY(-2px); }
        .month-card.past { opacity: 0.45; filter: grayscale(0.6); }
        .month-card.past:hover { transform: none; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
        .card-header { padding: 12px 14px; color: #fff; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .chevron { font-size: .7rem; opacity: .8; transition: transform .2s; }
        .month-card.active .chevron { transform: rotate(180deg); }
        .card-body { padding: 10px 14px 12px; }
        .card-event-count { font-size: .76rem; color: #aaa; margin-bottom: 6px; }
        .card-dots { display: flex; flex-wrap: wrap; gap: 4px; }
        .card-dot { width: 8px; height: 8px; border-radius: 50%; }
        .card-dot.holiday { background: #d32f2f; }
        .card-dot.normal  { background: #90a4ae; }

        /* ── Expanded panel ── */
        .expanded-panel { display: none; background: #fff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.1); overflow: hidden; margin-top: 16px; }
        .expanded-panel.open { display: block; }

        .exp-header { padding: 14px 20px; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .exp-nav { display: flex; align-items: center; gap: 10px; }
        .exp-nav-btn { background: rgba(255,255,255,.2); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
        .exp-nav-btn:hover { background: rgba(255,255,255,.35); }
        .exp-nav-btn:disabled { opacity: .3; cursor: default; }
        .exp-title { font-size: 1.1rem; font-weight: 700; }
        .exp-close { background: rgba(255,255,255,.2); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: .9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .exp-close:hover { background: rgba(255,255,255,.35); }

        /* ── Calendar grid ── */
        .cal-wrap { display: flex; gap: 0; }
        .cal-grid-section { flex: 1; padding: 20px; min-width: 0; }
        .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 0; border: 1px solid #d0d5dd; }
        .cal-day-name { text-align: center; font-size: .7rem; font-weight: 700; color: #888; text-transform: uppercase; padding: 6px 2px; background: #f8f9fa; border-bottom: 1px solid #d0d5dd; border-right: 1px solid #d0d5dd; }
        .cal-day-name:last-child { border-right: none; }
        .cal-cell { min-height: 70px; border-radius: 0; padding: 5px 6px; background: #fff; font-size: .82rem; position: relative; transition: background .1s; border-right: 1px solid #d0d5dd; border-bottom: 1px solid #d0d5dd; }
        .cal-cell:nth-child(7n) { border-right: none; }
        .cal-cell.empty { background: #fafafa; }
        .cal-cell.weekend { background: #f5f5f5; }
        .cal-cell.has-event    { background: #f0fdf4; }
        .cal-cell.has-birthday { background: #fffbeb; }
        .cal-cell.has-holiday  { background: #fff5f5; }
        .cal-cell.today .cell-num { background: #1a1f36; color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
        .cal-cell.clickable { cursor: pointer; }
        .cal-cell.clickable:hover { background: #eff6ff; }
        .cal-cell.selected { outline: 2px solid #1a1f36; outline-offset: -2px; }
        .cell-num { font-weight: 600; color: #333; font-size: .88rem; margin-bottom: 3px; }
        .cell-ev-tag { display: block; font-size: .68rem; color: #444; background: rgba(0,0,0,.06); border-radius: 3px; padding: 1px 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cell-ev-tag.holiday  { background: #ffcdd2; color: #b71c1c; font-weight: 600; }
        .cell-ev-tag.birthday { background: #fff3cd; color: #856404; font-weight: 600; }
        .cell-reactions { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
        .cell-rxn { font-size: .65rem; color: #888; display: flex; align-items: center; gap: 2px; }

        /* ── Feedback panel ── */
        .feedback-panel { width: 320px; flex-shrink: 0; border-left: 1px solid #eee; display: none; flex-direction: column; max-height: 540px; }
        .feedback-panel.open { display: flex; }
        .fp-header { padding: 16px 16px 12px; border-bottom: 1px solid #eee; }
        .fp-event-name { font-weight: 700; color: #1a1f36; font-size: .95rem; margin-bottom: 4px; }
        .fp-event-date { font-size: .78rem; color: #aaa; }
        .fp-reactions { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #eee; }
        .rxn-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1.5px solid #eee; background: #fff; cursor: pointer; font-size: .88rem; font-weight: 600; color: #555; transition: all .15s; flex: 1; justify-content: center; }
        .rxn-btn:hover { border-color: #bbb; }
        .rxn-btn.liked    { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
        .rxn-btn.disliked { background: #fdecea; border-color: #ef5350; color: #c62828; }
        .rxn-btn .count { font-size: .82rem; }
        .fp-login-prompt { padding: 16px; font-size: .84rem; color: #888; text-align: center; }
        .fp-login-prompt a { color: #1a1f36; font-weight: 600; text-decoration: none; }
        .fp-comments { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; }
        .comment-meta { font-size: .74rem; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .comment-author { font-weight: 600; color: #555; }
        .comment-body { font-size: .86rem; color: #333; line-height: 1.5; }
        .comment-del { background: none; border: none; color: #ddd; cursor: pointer; font-size: .8rem; padding: 2px 4px; }
        .comment-del:hover { color: #e53935; }
        .fp-no-comments { font-size: .84rem; color: #ccc; text-align: center; padding: 20px 0; }
        .fp-compose { padding: 12px 16px; border-top: 1px solid #eee; display: flex; gap: 8px; }
        .fp-compose textarea { flex: 1; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 8px 10px; font-size: .85rem; resize: none; outline: none; font-family: inherit; height: 60px; transition: border-color .15s; }
        .fp-compose textarea:focus { border-color: #1a1f36; }
        .fp-send { padding: 8px 14px; background: #1a1f36; color: #fff; border: none; border-radius: 8px; font-size: .82rem; cursor: pointer; align-self: flex-end; }
        .fp-send:hover { background: #2d3561; }
        .bookmark-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 4px; color: #ccc; transition: color .15s; }
        .bookmark-btn.bookmarked { color: #ff9800; }

        /* Bookmarks in right well */
        .bookmark-item { padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: .81rem; color: #555; cursor: pointer; }
        .bookmark-item:last-child { border-bottom: none; }
        .bookmark-item:hover { color: #1a1f36; }

        /* Filter bar */
        .filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-btn { padding: 5px 14px; border-radius: 20px; border: 1.5px solid #ddd; background: #fff; font-size: .82rem; cursor: pointer; color: #555; transition: all .15s; }
        .filter-btn:hover { border-color: #1a1f36; color: #1a1f36; }
        .filter-btn.active { background: #1a1f36; color: #fff; border-color: #1a1f36; }
        .filter-btn.birthday-btn.active { background: #f59e0b; border-color: #f59e0b; }

        /* Right well event list */
        .upcoming-event.is-past .ev-name { color: #bbb; }
        .upcoming-event.is-past .ev-date { color: #ccc; }
        .upcoming-event.is-past:hover .ev-name { color: #999; }

        /* Admin inline edit in feedback panel */
        .fp-admin-edit { border-top: 1px solid #eee; padding: 12px 16px; }
        .fp-admin-title { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #888; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .fp-admin-event-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .fp-admin-event-row span { flex: 1; font-size: .83rem; color: #333; background: #f5f5f5; padding: 5px 8px; border-radius: 4px; }
        .fp-admin-del { background: none; border: none; color: #ddd; cursor: pointer; font-size: .85rem; padding: 3px 5px; }
        .fp-admin-del:hover { color: #e53935; }
        .fp-admin-add { display: flex; gap: 6px; margin-top: 8px; }
        .fp-admin-add input { flex: 1; border: 1.5px solid #ddd; border-radius: 6px; padding: 6px 9px; font-size: .83rem; outline: none; }
        .fp-admin-add input:focus { border-color: #1a1f36; }
        .fp-admin-save { padding: 6px 14px; background: #1a1f36; color: #fff; border: none; border-radius: 6px; font-size: .82rem; cursor: pointer; white-space: nowrap; }
        .fp-admin-save:hover { background: #2d3561; }

        /* ── Personal event tags ── */
        .cell-ev-tag.personal { background: #ede9fe; color: #5b21b6; }
        .cal-cell.has-personal { background: #f5f3ff; }

        /* ── FAB ── */
        .fab { position: fixed; bottom: 28px; right: 28px; z-index: 50; }
        .fab-main { width: 54px; height: 54px; border-radius: 50%; background: #1a1f36; color: #fff; border: none; font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; transition: background .15s, transform .15s; }
        .fab-main:hover { background: #2d3561; transform: scale(1.07); }
        .fab-menu { display: none; flex-direction: column; gap: 8px; margin-bottom: 10px; align-items: flex-end; }
        .fab-menu.open { display: flex; }
        .fab-option { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .fab-option-lbl { background: #1a1f36; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: .82rem; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        .fab-option-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); }

        /* ── Add modal ── */
        .add-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
        .add-overlay.open { display: flex; }
        .add-modal { background: #fff; border-radius: 14px; padding: 28px; width: 92%; max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,.15); }
        .add-modal h3 { font-size: 1.05rem; color: #1a1f36; margin-bottom: 16px; }
        .am-field { margin-bottom: 12px; }
        .am-field label { display: block; font-size: .75rem; font-weight: 700; color: #555; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
        .am-field input { width: 100%; padding: 10px 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: .9rem; outline: none; }
        .am-field input:focus { border-color: #1a1f36; }
        .am-btns { display: flex; gap: 10px; margin-top: 16px; }
        .am-save { flex: 1; padding: 11px; background: #1a1f36; color: #fff; border: none; border-radius: 8px; font-size: .9rem; font-weight: 600; cursor: pointer; }
        .am-save:hover { background: #2d3561; }
        .am-cancel { padding: 11px 16px; background: #f0f0f0; color: #444; border: none; border-radius: 8px; cursor: pointer; }

        /* ── Mobile ── */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; padding: 12px; }
            .well { display: none; }
            .main { padding: 0; display: flex; flex-direction: column; }
            .filter-bar         { order: 1; }
            .months-grid        { order: 3; }
            .expanded-panel     { order: 4; }
            .mobile-events-section { display: block; order: 5; }
            /* Birthday mode: pull events list above the grid */
            .main.birthday-mode .mobile-events-section { order: 2; }
            .main.birthday-mode .mobile-events-list { max-height: 320px; overflow-y: auto; }
        }
        @media (max-width: 768px) {
            header { padding: 0 14px; height: 52px; }
            header h1 { font-size: .95rem; }
            .nav-link { padding: 6px 8px; font-size: .76rem; }
            .nav-btn-logout { padding: 6px 8px; font-size: .76rem; }

            .months-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card-header { padding: 10px 12px; font-size: .9rem; }
            .card-body { padding: 8px 12px 10px; }

            /* Expanded panel */
            .expanded-panel { margin-top: 12px; border-radius: 8px; }
            .exp-header { padding: 12px 14px; }
            .exp-title { font-size: .95rem; }
            .exp-nav-btn { width: 28px; height: 28px; font-size: .85rem; }

            /* Calendar grid — keep 7 cols, reduce size */
            .cal-grid-section { padding: 10px 6px 12px; }
            .cal-grid { gap: 0; }
            .cal-day-name { font-size: .6rem; padding: 4px 1px; }
            .cal-cell { min-height: 52px; padding: 3px 2px; }
            .cell-num { font-size: .75rem; margin-bottom: 1px; }
            .cell-num.today-num { width: 20px; height: 20px; font-size: .72rem; }
            .cell-ev-tag { font-size: .58rem; padding: 1px 3px; margin-bottom: 1px; }
            .cell-reactions { gap: 3px; margin-top: 2px; }
            .cell-rxn { font-size: .58rem; }

            /* Feedback panel stacks below calendar */
            .cal-wrap { flex-direction: column; }
            .feedback-panel { width: 100%; border-left: none; border-top: 1px solid #eee; max-height: 380px; }
            .rxn-btn { padding: 10px; font-size: .9rem; }
            .fp-compose textarea { height: 50px; }
        }
        @media (max-width: 420px) {
            .months-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .card-dots { gap: 3px; }
            /* Hide nav text labels, keep emoji icons */
            .nav-link { font-size: 0; padding: 6px 10px; }
            .nav-link::first-letter { font-size: 14px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Engagement Calendar 2026</h1>
    <div class="nav-links">
        <a href="/calendar.html" class="nav-link active" title="Home">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:4px"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home
        </a>
        <a href="/admin.html" class="nav-link" id="nav-admin" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Admin</a>
        <a href="/users.html" class="nav-link" id="nav-users" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</a>
        <a href="/login.html" class="nav-link" id="nav-login">Login</a>
        <button class="nav-btn-logout" id="nav-logout" style="display:none" onclick="logout()">Logout</button>
    </div>
</header>

<div class="layout">
    <aside class="well" id="left-well">
        <h3>Legend</h3>
        <div class="legend-item"><div class="legend-dot" style="background:#d32f2f"></div>Public Holiday</div>
        <div class="legend-item"><div class="legend-dot" style="background:#90a4ae"></div>Event</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#fff5f5;border:1px solid #ddd"></div>Holiday day</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#f5f5f5;border:1px solid #ddd"></div>Weekend</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#f0fdf4;border:1px solid #ddd"></div>Event day</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#fffbeb;border:1px solid #ddd"></div>Birthday</div>
        <hr style="margin:14px 0;border:none;border-top:1px solid #eee;flex-shrink:0">
        <h3>Months</h3>
        <div class="well-scroll"><div id="month-nav"></div></div>
    </aside>

    <main class="main">
        <div class="filter-bar">
            <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All Events</button>
            <button class="filter-btn birthday-btn" id="filter-birthdays" onclick="setFilter('birthdays')">🎂 Birthdays</button>
        </div>
        <div class="months-grid" id="months-grid"></div>
        <div class="expanded-panel" id="month-detail"></div>
        <!-- Mobile-only events list -->
        <div class="mobile-events-section" id="mobile-events-section">
            <button class="mobile-events-toggle" onclick="toggleMobileEvents(this)">
                <span id="mobile-events-title">All Events</span>
                <span>&#9660;</span>
            </button>
            <div class="mobile-events-list" id="mobile-events-list"></div>
        </div>
    </main>

    <aside class="well" id="right-well">
        <h3 id="right-well-title">All Events</h3>
        <div class="well-scroll">
            <div id="upcoming-list"></div>
            <div id="bookmarks-section" style="display:none">
                <hr style="margin:12px 0;border:none;border-top:1px solid #eee">
                <h3 style="font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:10px">My Bookmarks</h3>
                <div id="bookmarks-list"></div>
            </div>
        </div>
    </aside>
</div>

<!-- FAB -->
<div class="fab" id="fab" style="display:none">
    <div class="fab-menu" id="fab-menu">
        <div class="fab-option" id="fab-team" onclick="openAddModal('team')" style="display:none">
            <span class="fab-option-lbl">Add Team Event</span>
            <button class="fab-option-btn" style="background:#1a1f36;color:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
        </div>
        <div class="fab-option" onclick="openAddModal('personal')">
            <span class="fab-option-lbl">Add Personal Event</span>
            <button class="fab-option-btn" style="background:#7c3aed;color:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
        </div>
    </div>
    <button class="fab-main" id="fab-btn" onclick="toggleFab()">&#43;</button>
</div>

<!-- Add event modal -->
<div class="add-overlay" id="add-overlay" onclick="if(event.target===this)closeAddModal()">
    <div class="add-modal">
        <h3 id="add-modal-title">Add Event</h3>
        <div class="am-field"><label>Date</label><input type="date" id="add-date" /></div>
        <div class="am-field"><label>Event Name</label><input type="text" id="add-name" placeholder="What's happening?" /></div>
        <div class="am-btns">
            <button class="am-cancel" onclick="closeAddModal()">Cancel</button>
            <button class="am-save" onclick="submitAdd()">Add</button>
        </div>
    </div>
</div>

<script>
let calendarData      = {};
let birthdayEvents    = [];
let monthKeys         = [];
let activeMonth       = null;
let expandedEl        = null;
let me                = null;
let activeFeedbackKey = null;
let activeFilter      = 'all'; // 'all' | 'birthdays'
let personalEvents    = [];    // current user's personal events
let addModalType      = 'personal'; // 'personal' | 'team'

const TODAY = new Date();

// Auth-ready promise — ensures feedback panel always knows auth state
let resolveAuth;
const authReady = new Promise(resolve => { resolveAuth = resolve; });

// ── Auth check ────────────────────────────────────────────────────────────────
fetch('/api/auth-status').then(r=>r.json()).then(d => {
    if (d.authenticated) {
        me = { username: d.username, role: d.role };
        document.getElementById('nav-login').style.display   = 'none';
        document.getElementById('nav-logout').style.display  = 'inline-block';
        if (['admin','superadmin'].includes(d.role)) document.getElementById('nav-admin').style.display = 'inline-block';
        if (d.role === 'superadmin') document.getElementById('nav-users').style.display = 'inline-block';
        loadBookmarks();
        loadPersonalEvents();
        // Show FAB for all logged-in users
        document.getElementById('fab').style.display = 'block';
        if (['admin','superadmin'].includes(d.role)) document.getElementById('fab-team').style.display = 'flex';
    }
    resolveAuth();
});

async function logout() {
    await fetch('/api/logout', { method:'POST' });
    location.href = '/login.html';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function isHoliday(ev) { return ev.name !== 'Placeholder Event' && ev.name.toLowerCase().includes('day'); }
function formatShort(dateStr) { const d=new Date(dateStr+'T00:00:00'); return d.toLocaleString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}); }
function ordinal(n) { const s=["th","st","nd","rd"],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function getDateRange(events) {
    if (!events?.length) return '';
    const days = events.map(e => new Date(e.date+'T00:00:00').getDate());
    return `${ordinal(Math.min(...days))} – ${ordinal(Math.max(...days))}`;
}
function eventKey(ev) { return ev.date; }

// ── Data ──────────────────────────────────────────────────────────────────────
const MONTH_ORDER = ['January','February','March','April','May','June','July','August','September','October','November','December'];

async function loadData() {
    const [calRes, bdRes] = await Promise.all([fetch('/api/calendar'), fetch('/api/birthdays')]);
    calendarData   = await calRes.json();
    birthdayEvents = await bdRes.json();
    monthKeys = Object.keys(calendarData).sort((a,b) => MONTH_ORDER.indexOf(a) - MONTH_ORDER.indexOf(b));
    buildGrid(); buildUpcoming(); buildMonthNav();
}

async function loadPersonalEvents() {
    const r = await fetch('/api/personal-events');
    if (!r.ok) return;
    personalEvents = await r.json();
    // Re-render grid if already built
    if (monthKeys.length) { buildGrid(); markPastMonths(); }
}

async function loadBookmarks() {
    const r = await fetch('/api/me/bookmarks');
    if (!r.ok) return;
    const bms = await r.json();
    const sec = document.getElementById('bookmarks-section');
    const list = document.getElementById('bookmarks-list');
    if (!bms.length) { sec.style.display='none'; return; }
    sec.style.display = 'block';
    list.innerHTML = bms.map(b => {
        const date = b.event_key;
        return `<div class="bookmark-item" onclick="jumpToDate('${date}')">${formatShort(date)}</div>`;
    }).join('');
}

function jumpToDate(date) {
    const month = Object.keys(calendarData).find(m =>
        (calendarData[m].events||[]).some(e => e.date === date)
    );
    if (month) openMonth(month, date);
}

// ── Left well month nav ───────────────────────────────────────────────────────
function buildMonthNav() {
    const nav = document.getElementById('month-nav');
    nav.innerHTML = monthKeys.map(month => {
        const color = calendarData[month].color || '#007bff';
        return `<div class="month-nav-link" id="mnl-${month}" onclick="openMonth('${month}')">
            <span class="mnl-dot" style="background:${color}"></span>${month}
        </div>`;
    }).join('');
}

// ── Right well all events ─────────────────────────────────────────────────────
function setFilter(filter) {
    activeFilter = filter;
    document.getElementById('filter-all').classList.toggle('active', filter === 'all');
    document.getElementById('filter-birthdays').classList.toggle('active', filter === 'birthdays');
    document.getElementById('right-well-title').textContent = filter === 'birthdays' ? '🎂 Birthdays' : 'All Events';
    buildUpcoming();

    // Mobile: reorder and auto-open accordion when birthdays selected
    const main = document.querySelector('.main');
    const mobileList = document.getElementById('mobile-events-list');
    const chevron = document.querySelector('.mobile-events-toggle span:last-child');
    if (filter === 'birthdays') {
        main.classList.add('birthday-mode');
        mobileList.classList.add('open');
        if (chevron) chevron.textContent = '▲';
    } else {
        main.classList.remove('birthday-mode');
    }

    // Re-render open month if any
    if (activeMonth) {
        const panel = document.getElementById('month-detail');
        renderExpandedPanel(panel, activeMonth, null);
    }
}

function buildUpcoming() {
    const list = document.getElementById('upcoming-list');
    const now  = new Date();
    const all  = [];

    if (activeFilter !== 'birthdays') {
        monthKeys.forEach(m => {
            const color = calendarData[m].color || '#007bff';
            (calendarData[m].events || []).forEach(ev => all.push({ ...ev, color, month: m }));
        });
    }

    birthdayEvents.forEach(bd => {
        const month = monthKeys.find(m =>
            (calendarData[m].events||[]).some(e => e.date.slice(5,7) === bd.date.slice(5,7))
        ) || monthKeys[0];
        all.push({ ...bd, color: '#f59e0b', month, isBirthday: true });
    });

    all.sort((a, b) => a.date.localeCompare(b.date));

    const html = all.map(ev => {
        const isPast = new Date(ev.date + 'T23:59:59') < now;
        const dotColor = ev.isBirthday ? '#f59e0b' : isHoliday(ev) ? '#d32f2f' : ev.color;
        return `<div class="upcoming-event${isPast ? ' is-past' : ''}" onclick="openMonth('${ev.month}','${ev.date}')">
            <div class="ev-date">${formatShort(ev.date)}</div>
            <div class="ev-name"><span class="ev-dot" style="background:${dotColor}"></span>${ev.name}</div>
        </div>`;
    }).join('');

    list.innerHTML = html;

    // Sync mobile events list
    const mobileList = document.getElementById('mobile-events-list');
    if (mobileList) {
        mobileList.innerHTML = html;
        document.getElementById('mobile-events-title').textContent =
            activeFilter === 'birthdays' ? '🎂 Birthdays' : 'All Events';
    }
}

function toggleMobileEvents(btn) {
    const list = document.getElementById('mobile-events-list');
    list.classList.toggle('open');
    btn.querySelector('span:last-child').textContent = list.classList.contains('open') ? '▲' : '▼';
}

// ── Month cards grid ──────────────────────────────────────────────────────────
function buildGrid() {
    const grid = document.getElementById('months-grid');
    grid.innerHTML = '';
    monthKeys.forEach(month => {
        const data   = calendarData[month];
        const events = data.events || [];
        const card   = document.createElement('div');
        card.className = 'month-card';
        card.id = `card-${month}`;
        card.innerHTML = `
            <div class="card-header" style="background:${data.color||'#007bff'}">
                <span>${month}</span><span class="chevron">&#9660;</span>
            </div>
            <div class="card-body">
                <div class="card-event-count">${events.length} event${events.length!==1?'s':''}</div>
                <div class="card-dots">${events.map(ev=>`<div class="card-dot ${isHoliday(ev)?'holiday':'normal'}" title="${ev.name}"></div>`).join('')}</div>
            </div>`;
        card.addEventListener('click', () => toggleMonth(month));
        grid.appendChild(card);
    });
    markPastMonths();
}

function markPastMonths() {
    const now = new Date();
    monthKeys.forEach(month => {
        const events = calendarData[month]?.events || [];
        if (!events.length) return;
        // Get the last day of this month from event dates
        const dates = events.map(e => new Date(e.date + 'T00:00:00'));
        const year  = dates[0].getFullYear();
        const mIdx  = dates[0].getMonth();
        const lastDay = new Date(year, mIdx + 1, 0); // last day of month
        const card = document.getElementById(`card-${month}`);
        if (card) card.classList.toggle('past', lastDay < now);
    });
}

// ── Expand/navigate ───────────────────────────────────────────────────────────
function toggleMonth(month) {
    if (activeMonth === month) { closeExpanded(); return; }
    openMonth(month);
}

function openMonth(month, highlightDate = null) {
    if (activeMonth === month && !highlightDate) { closeExpanded(); return; }

    // Deactivate previous card + sidebar link
    if (activeMonth) {
        document.getElementById(`card-${activeMonth}`)?.classList.remove('active');
        document.getElementById(`mnl-${activeMonth}`)?.classList.remove('active');
    }

    activeMonth = month;
    const card  = document.getElementById(`card-${month}`);
    const panel = document.getElementById('month-detail'); // single shared panel

    card.classList.add('active');
    document.getElementById(`mnl-${month}`)?.classList.add('active');
    renderExpandedPanel(panel, month, highlightDate);
    panel.classList.add('open');

    if (!highlightDate) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    expandedEl = { card, panel };
}

function closeExpanded() {
    if (!expandedEl) return;
    expandedEl.card.classList.remove('active');
    expandedEl.panel.classList.remove('open');
    expandedEl.panel.innerHTML = '';
    document.getElementById(`mnl-${activeMonth}`)?.classList.remove('active');
    activeMonth = null; expandedEl = null; activeFeedbackKey = null;
}

function navigateMonth(dir) {
    const idx = monthKeys.indexOf(activeMonth);
    const next = monthKeys[idx + dir];
    if (next) openMonth(next);
}

// ── Render expanded panel ─────────────────────────────────────────────────────
function renderExpandedPanel(panel, month, highlightDate) {
    const data   = calendarData[month];
    const events = data.events || [];
    const idx    = monthKeys.indexOf(month);
    const color  = data.color || '#007bff';

    const firstDate = events[0] ? new Date(events[0].date+'T00:00:00') : new Date();
    const year      = events[0] ? parseInt(events[0].date.split('-')[0]) : TODAY.getFullYear();
    const monthIdx  = events[0] ? parseInt(events[0].date.split('-')[1])-1 : TODAY.getMonth();
    const daysInMonth = new Date(year, monthIdx+1, 0).getDate();
    const firstDow    = new Date(year, monthIdx, 1).getDay();

    // Merge birthday and personal events for this month
    const allEvents = [...events];
    birthdayEvents.forEach(bd => {
        const [y, m] = bd.date.split('-').map(Number);
        if (y === year && m === monthIdx + 1) allEvents.push({ ...bd, isBirthday: true });
    });
    if (me) personalEvents.forEach(pe => {
        const [y, m] = pe.date.split('-').map(Number);
        if (y === year && m === monthIdx + 1) allEvents.push({ ...pe, isPersonal: true });
    });

    const eventMap = {};
    allEvents.forEach(ev => {
        const d = parseInt(ev.date.split('-')[2]);
        if (!eventMap[d]) eventMap[d] = [];
        eventMap[d].push(ev);
    });

    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let cells = dayNames.map(d => `<div class="cal-day-name">${d}</div>`).join('');
    for (let i=0; i<firstDow; i++) cells += `<div class="cal-cell empty"></div>`;

    for (let d=1; d<=daysInMonth; d++) {
        const dow      = (firstDow+d-1)%7;
        const isWknd   = dow===0||dow===6;
        const dayEvs   = eventMap[d]||[];
        const hasHol   = dayEvs.some(ev => isHoliday(ev));
        const hasEv    = dayEvs.length>0;
        const dateStr  = `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isTdy    = TODAY.getFullYear()===year && TODAY.getMonth()===monthIdx && TODAY.getDate()===d;
        const isHl     = dateStr === highlightDate;

        const hasBd  = dayEvs.some(ev => ev.isBirthday);
        const hasPer = dayEvs.some(ev => ev.isPersonal);
        let cls = 'cal-cell';
        if (isWknd) cls += ' weekend';
        if (hasHol)       cls += ' has-holiday';
        else if (hasBd)   cls += ' has-birthday';
        else if (hasPer && !hasEv) cls += ' has-personal';
        else if (hasEv)   cls += ' has-event';
        if (isTdy)  cls += ' today';
        if (hasEv)  cls += ' clickable';
        if (isHl)   cls += ' selected';

        const evTags = dayEvs.map(ev =>
            `<span class="cell-ev-tag ${ev.isPersonal ? 'personal' : ev.isBirthday ? 'birthday' : isHoliday(ev) ? 'holiday' : ''}">${ev.name}</span>`
        ).join('');

        const rxnBar = hasEv ? `<div class="cell-reactions" id="rxns-${dateStr}"></div>` : '';

        cells += `<div class="${cls}" id="cell-${dateStr}" ${hasEv?`onclick="openFeedback('${dateStr}',this)"`:''}>
            <div class="cell-num">${d}</div>
            <div class="cell-events">${evTags}</div>
            ${rxnBar}
        </div>`;
    }

    panel.innerHTML = `
        <div class="exp-header" style="background:${color}">
            <div class="exp-nav">
                <button class="exp-nav-btn" onclick="navigateMonth(-1)" ${idx===0?'disabled':''} title="Previous month">&#8592;</button>
                <span class="exp-title">${month} ${year}</span>
                <button class="exp-nav-btn" onclick="navigateMonth(1)" ${idx===monthKeys.length-1?'disabled':''} title="Next month">&#8594;</button>
            </div>
            <span style="font-size:.82rem;opacity:.7">${getDateRange(events)}</span>
            <button class="exp-close" onclick="closeExpanded()">&#x2715;</button>
        </div>
        <div class="cal-wrap">
            <div class="cal-grid-section">
                <div class="cal-grid">${cells}</div>
            </div>
            <div class="feedback-panel" id="feedback-panel"></div>
        </div>`;

    // Load reaction counts for all event days
    events.forEach(ev => loadCellReactions(ev.date));

    if (highlightDate && eventMap[parseInt(highlightDate.split('-')[2])]) {
        setTimeout(() => {
            const cell = document.getElementById(`cell-${highlightDate}`);
            if (cell) openFeedback(highlightDate, cell);
        }, 50);
    }
}

// ── Load cell reaction counts ─────────────────────────────────────────────────
async function loadCellReactions(dateStr) {
    const el = document.getElementById(`rxns-${dateStr}`);
    if (!el) return;
    try {
        const r = await fetch(`/api/events/${encodeURIComponent(dateStr)}/feedback`);
        const d = await r.json();
        el.innerHTML = '';
        if (d.reactions.like)    el.innerHTML += `<span class="cell-rxn">👍 ${d.reactions.like}</span>`;
        if (d.reactions.dislike) el.innerHTML += `<span class="cell-rxn">👎 ${d.reactions.dislike}</span>`;
        if (d.comments.length)   el.innerHTML += `<span class="cell-rxn">💬 ${d.comments.length}</span>`;
    } catch {}
}

// ── Feedback panel ────────────────────────────────────────────────────────────
async function openFeedback(dateStr, cellEl) {
    await authReady; // ensure me is set before rendering bookmark/react buttons
    if (activeFeedbackKey) document.getElementById(`cell-${activeFeedbackKey}`)?.classList.remove('selected');
    activeFeedbackKey = dateStr;
    cellEl.classList.add('selected');

    const fp = document.getElementById('feedback-panel');
    fp.className = 'feedback-panel open';
    fp.innerHTML = '<div style="padding:20px;color:#bbb;font-size:.88rem">Loading…</div>';

    const evs  = calendarData[activeMonth]?.events?.filter(e => e.date === dateStr) || [];
    const evNames = evs.map(e=>e.name).join(', ') || 'Event';

    try {
        const r = await fetch(`/api/events/${encodeURIComponent(dateStr)}/feedback`);
        const d = await r.json();
        renderFeedbackPanel(fp, dateStr, evNames, d);
    } catch { fp.innerHTML = '<div style="padding:20px;color:#e53935">Failed to load feedback.</div>'; }
}

function renderFeedbackPanel(fp, dateStr, evNames, data) {
    const canInteract = !!me;
    const isAdmin     = me && ['admin','superadmin'].includes(me.role);
    const likedClass    = data.userReaction==='like'    ? 'liked'    : '';
    const dislikedClass = data.userReaction==='dislike' ? 'disliked' : '';
    const bmClass = data.bookmarked ? 'bookmarked' : '';

    // Get current events for this day from calendarData
    const month   = activeMonth;
    const dayEvs  = (calendarData[month]?.events || []).filter(e => e.date === dateStr);

    fp.innerHTML = `
        <div class="fp-header">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                    <div class="fp-event-name">${evNames}</div>
                    <div class="fp-event-date">${formatShort(dateStr)}</div>
                </div>
                ${canInteract ? `<button class="bookmark-btn ${bmClass}" id="bm-btn-${dateStr}" onclick="toggleBookmark('${dateStr}')" title="Bookmark">&#128278;</button>` : ''}
            </div>
        </div>
        <div class="fp-reactions">
            ${canInteract
                ? `<button class="rxn-btn ${likedClass}" id="like-btn" onclick="react('${dateStr}','like')">👍 <span class="count" id="like-count">${data.reactions.like}</span></button>
                   <button class="rxn-btn ${dislikedClass}" id="dislike-btn" onclick="react('${dateStr}','dislike')">👎 <span class="count" id="dislike-count">${data.reactions.dislike}</span></button>`
                : `<span style="font-size:.82rem;color:#aaa;padding:8px 0">👍 ${data.reactions.like} &nbsp; 👎 ${data.reactions.dislike}</span>`}
        </div>
        <div class="fp-comments" id="fp-comments-${dateStr}">
            ${renderComments(data.comments, dateStr)}
        </div>
        ${canInteract
            ? `<div class="fp-compose">
                   <textarea id="comment-input" placeholder="Leave a comment…"></textarea>
                   <button class="fp-send" onclick="postComment('${dateStr}')">Send</button>
               </div>`
            : `<div class="fp-login-prompt"><a href="/login.html">Login</a> to react and leave comments</div>`}
        ${isAdmin ? renderAdminEdit(dateStr, dayEvs, month) : ''}`;
}

function renderAdminEdit(dateStr, dayEvs, month) {
    const rows = dayEvs.map((ev, i) =>
        `<div class="fp-admin-event-row">
            <span>${ev.name}</span>
            <button class="fp-admin-del" onclick="adminDeleteEvent('${month}','${dateStr}',${i})" title="Remove">✕</button>
        </div>`
    ).join('');
    return `<div class="fp-admin-edit">
        <div class="fp-admin-title">
            <span style="display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Edit Events</span>
        </div>
        <div id="admin-ev-list-${dateStr}">${rows || '<div style="font-size:.8rem;color:#ccc;margin-bottom:6px">No events — add one below</div>'}</div>
        <div class="fp-admin-add">
            <input type="text" id="admin-ev-input-${dateStr}" placeholder="Event name…" />
            <button class="fp-admin-save" onclick="adminAddEvent('${month}','${dateStr}')">Add</button>
        </div>
    </div>`;
}

async function adminAddEvent(month, dateStr) {
    const input = document.getElementById(`admin-ev-input-${dateStr}`);
    const name  = input.value.trim();
    if (!name) return;
    calendarData[month].events = calendarData[month].events || [];
    calendarData[month].events.push({ date: dateStr, name });
    calendarData[month].events.sort((a,b) => a.date.localeCompare(b.date));
    await saveCalendar();
    input.value = '';
    // Refresh the panel
    openFeedback(dateStr, document.getElementById(`cell-${dateStr}`));
    buildGrid(); markPastMonths();
}

async function adminDeleteEvent(month, dateStr, idx) {
    const dayEvs = calendarData[month].events.filter(e => e.date === dateStr);
    const toRemove = dayEvs[idx];
    if (!toRemove) return;
    calendarData[month].events = calendarData[month].events.filter(e => !(e.date === toRemove.date && e.name === toRemove.name));
    await saveCalendar();
    openFeedback(dateStr, document.getElementById(`cell-${dateStr}`));
    buildGrid(); markPastMonths();
}

async function saveCalendar() {
    await fetch('/api/calendar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(calendarData)
    });
}

function renderComments(comments, dateStr) {
    if (!comments.length) return '<div class="fp-no-comments">No comments yet. Be the first!</div>';
    return comments.map(c => {
        const author = c.first_name ? `${c.first_name} ${c.last_name}` : c.username;
        const canDel = me && (me.username===c.username || ['admin','superadmin'].includes(me.role));
        return `<div class="comment-item" id="comment-${c.id}">
            <div class="comment-meta">
                <span class="comment-author">${author}</span>
                <span style="display:flex;align-items:center;gap:4px">
                    <span>${new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
                    ${canDel ? `<button class="comment-del" onclick="deleteComment('${dateStr}',${c.id})">✕</button>` : ''}
                </span>
            </div>
            <div class="comment-body">${escHtml(c.body)}</div>
        </div>`;
    }).join('');
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function react(dateStr, reaction) {
    if (!me) return;
    const r = await fetch(`/api/events/${encodeURIComponent(dateStr)}/react`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ reaction })
    });
    const d = await r.json();
    document.getElementById('like-count').textContent    = d.reactions.like;
    document.getElementById('dislike-count').textContent = d.reactions.dislike;
    // Refresh to get updated userReaction
    const fb = await fetch(`/api/events/${encodeURIComponent(dateStr)}/feedback`);
    const fd = await fb.json();
    document.getElementById('like-btn').className    = `rxn-btn ${fd.userReaction==='like'?'liked':''}`;
    document.getElementById('dislike-btn').className = `rxn-btn ${fd.userReaction==='dislike'?'disliked':''}`;
    loadCellReactions(dateStr);
}

async function postComment(dateStr) {
    const ta   = document.getElementById('comment-input');
    const body = ta.value.trim();
    if (!body) return;
    ta.value = '';
    const r = await fetch(`/api/events/${encodeURIComponent(dateStr)}/comments`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ body })
    });
    const d = await r.json();
    if (d.ok) {
        const container = document.getElementById(`fp-comments-${dateStr}`);
        if (container.querySelector('.fp-no-comments')) container.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'comment-item';
        div.id = `comment-${d.comment.id}`;
        const author = d.comment.first_name ? `${d.comment.first_name} ${d.comment.last_name}` : me.username;
        div.innerHTML = `<div class="comment-meta"><span class="comment-author">${author}</span><span><button class="comment-del" onclick="deleteComment('${dateStr}',${d.comment.id})">✕</button></span></div><div class="comment-body">${escHtml(body)}</div>`;
        container.appendChild(div);
        loadCellReactions(dateStr);
    }
}

async function deleteComment(dateStr, id) {
    await fetch(`/api/events/${encodeURIComponent(dateStr)}/comments/${id}`, { method:'DELETE' });
    document.getElementById(`comment-${id}`)?.remove();
    loadCellReactions(dateStr);
}

async function toggleBookmark(dateStr) {
    const btn = document.getElementById(`bm-btn-${dateStr}`);
    const isBookmarked = btn.classList.contains('bookmarked');
    if (isBookmarked) {
        await fetch(`/api/me/bookmarks/${encodeURIComponent(dateStr)}`, { method:'DELETE' });
        btn.classList.remove('bookmarked');
    } else {
        await fetch(`/api/me/bookmarks/${encodeURIComponent(dateStr)}`, { method:'POST' });
        btn.classList.add('bookmarked');
    }
    loadBookmarks();
}

// ── FAB ───────────────────────────────────────────────────────────────────────
function toggleFab() {
    const menu = document.getElementById('fab-menu');
    const btn  = document.getElementById('fab-btn');
    const open = menu.classList.toggle('open');
    btn.textContent = open ? '✕' : '+';
}

function openAddModal(type) {
    addModalType = type;
    document.getElementById('fab-menu').classList.remove('open');
    document.getElementById('fab-btn').textContent = '+';
    document.getElementById('add-modal-title').textContent =
        type === 'team' ? '📅 Add Team Event' : '📝 Add Personal Event';
    // Pre-fill date with selected day if any
    if (activeFeedbackKey) document.getElementById('add-date').value = activeFeedbackKey;
    document.getElementById('add-overlay').classList.add('open');
    document.getElementById('add-name').focus();
}

function closeAddModal() {
    document.getElementById('add-overlay').classList.remove('open');
    document.getElementById('add-name').value = '';
    document.getElementById('add-date').value = '';
}

async function submitAdd() {
    const date = document.getElementById('add-date').value;
    const name = document.getElementById('add-name').value.trim();
    if (!date || !name) return;

    if (addModalType === 'personal') {
        const r = await fetch('/api/personal-events', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, name })
        });
        const d = await r.json();
        if (d.ok) { personalEvents.push(d.event); }
    } else {
        // Team event: find/create month
        const [,m] = date.split('-').map(Number);
        const mName = MONTH_ORDER[m-1];
        if (!calendarData[mName]) calendarData[mName] = { color:'#607d8b', events:[] };
        calendarData[mName].events = calendarData[mName].events || [];
        calendarData[mName].events.push({ date, name });
        calendarData[mName].events.sort((a,b) => a.date.localeCompare(b.date));
        await saveCalendar();
        if (!monthKeys.includes(mName)) { monthKeys = Object.keys(calendarData).sort((a,b) => MONTH_ORDER.indexOf(a)-MONTH_ORDER.indexOf(b)); buildGrid(); buildMonthNav(); }
    }
    closeAddModal();
    buildGrid(); markPastMonths(); buildUpcoming();
    if (activeMonth) {
        const panel = document.getElementById('month-detail');
        renderExpandedPanel(panel, activeMonth, null);
    }
}

loadData();
</script>
