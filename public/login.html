<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Engagement Calendar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef0f3; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #1a1f36; color: #fff; padding: 18px 32px; }
        header h1 { font-size: 1.3rem; font-weight: 600; }
        .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 28px rgba(0,0,0,0.1); padding: 44px 40px; width: 100%; max-width: 400px; }
        .card h2 { font-size: 1.5rem; color: #1a1f36; margin-bottom: 6px; }
        .card p { font-size: 0.9rem; color: #888; margin-bottom: 30px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 0.78rem; font-weight: 700; color: #555; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.6px; }
        .field input { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 9px; font-size: 0.97rem; outline: none; transition: border-color 0.15s; background: #fafafa; }
        .field input:focus { border-color: #1a1f36; background: #fff; }
        .btn { width: 100%; padding: 13px; background: #1a1f36; color: #fff; border: none; border-radius: 9px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 6px; transition: background 0.15s; }
        .btn:hover { background: #2d3561; }
        .btn:disabled { background: #b0b0b0; cursor: default; }
        .btn-ghost { background: #f0f0f0; color: #444; margin-top: 10px; }
        .btn-ghost:hover { background: #e0e0e0; }
        .error { background: #fdecea; color: #b71c1c; border-radius: 8px; padding: 11px 14px; font-size: 0.88rem; margin-bottom: 16px; display: none; }
        #step-otp { display: none; }
        .wa-hint { display: flex; align-items: center; gap: 10px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 9px; padding: 12px 14px; margin-bottom: 22px; font-size: 0.87rem; color: #166534; }
        .otp-input { text-align: center; letter-spacing: 8px; font-size: 1.5rem; font-weight: 700; }
        @media (max-width: 480px) { .card { padding: 28px 20px; } header { padding: 14px 20px; } }
    </style>
</head>
<body>
<header><h1>Engagement Calendar 2026</h1></header>
<div class="page">
  <div class="card">

    <div id="step-credentials">
      <h2>Welcome back</h2>
      <p>Enter your username and we'll send a verification code to you.</p>
      <div class="error" id="cred-error"></div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" />
      </div>
      <button class="btn" id="login-btn" onclick="submitUsername()">Send Verification Code</button>
    </div>

    <!-- Choose method (shown when password exists) -->
    <div id="step-method" style="display:none">
      <h2>How to sign in?</h2>
      <p style="font-size:.88rem;color:#888;margin-bottom:22px">Choose how you'd like to verify.</p>
      <button class="btn" onclick="chooseMethod('code')" style="margin-bottom:10px">&#128233; Send verification code</button>
      <button class="btn" style="background:#4527a0" onclick="chooseMethod('password')">&#128274; Enter my password</button>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="backToUsername()">&#8592; Back</button>
    </div>

    <!-- OTP step -->
    <div id="step-otp" style="display:none">
      <h2>Check your inbox</h2>
      <div class="wa-hint" id="otp-channel-hint" style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>
        A 6-digit code was sent to your email.
      </div>
      <div class="error" id="otp-error"></div>
      <div class="field">
        <label>Verification Code</label>
        <input type="text" id="otp-input" class="otp-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
      </div>
      <button class="btn" id="verify-btn" onclick="submitOtp()">Verify & Login</button>
      <button class="btn btn-ghost" onclick="backToUsername()">&#8592; Back</button>
    </div>

    <!-- Password step -->
    <div id="step-password" style="display:none">
      <h2>Enter your password</h2>
      <p style="font-size:.88rem;color:#888;margin-bottom:22px">Use the password that was sent to your email.</p>
      <div class="error" id="pwd-error"></div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="pwd-input" autocomplete="current-password" />
      </div>
      <button class="btn" id="pwd-btn" onclick="submitPassword()">Login</button>
      <button class="btn btn-ghost" onclick="backToUsername()">&#8592; Back</button>
    </div>

  </div>
</div>
<script>
fetch('/api/auth-status').then(r=>r.json()).then(d => {
    if (d.authenticated) window.location.href = d.role === 'superadmin' ? '/users.html' : '/admin.html';
});

let pendingUsername = '';
document.getElementById('username').addEventListener('keydown', e => { if(e.key==='Enter') submitUsername(); });
document.addEventListener('keydown', e => {
    if(e.key==='Enter') {
        if(document.getElementById('step-otp').style.display!=='none') submitOtp();
        if(document.getElementById('step-password').style.display!=='none') submitPassword();
    }
});

function showErr(id, msg) { const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
function hideErr(id) { document.getElementById(id).style.display='none'; }

async function submitUsername() {
    hideErr('cred-error');
    const btn = document.getElementById('login-btn');
    const username = document.getElementById('username').value.trim();
    if (!username) return;
    btn.disabled = true; btn.textContent = 'Sending…';

    try {
        const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username }) });
        const d = await r.json();
        if (!r.ok) { showErr('cred-error', d.error || 'Login failed'); btn.disabled=false; btn.textContent='Send Verification Code'; return; }
        pendingUsername = username;
        btn.disabled=false; btn.textContent='Send Verification Code';
        document.getElementById('step-credentials').style.display = 'none';

        if (d.hasPassword) {
            document.getElementById('step-method').style.display = 'block';
            // Pre-warm the OTP hint so it's ready when they choose code
            showOtp(d.channel);
            document.getElementById('step-otp').style.display = 'none';
        } else {
            // No password — go straight to OTP
            showOtp(d.channel);
        }
    } catch { showErr('cred-error', 'Network error.'); btn.disabled=false; btn.textContent='Send Verification Code'; }
}

function showOtp(channel) {
    document.getElementById('step-method').style.display   = 'none';
    document.getElementById('step-otp').style.display      = 'block';
    document.getElementById('step-password').style.display = 'none';
    const hint = document.getElementById('otp-channel-hint');
    if (channel === 'whatsapp+email') {
        hint.style.cssText = 'background:#f0fdf4;border-color:#bbf7d0;color:#166534;display:flex;align-items:center;gap:10px;border:1px solid;border-radius:9px;padding:12px 14px;margin-bottom:22px;font-size:.87rem';
        hint.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.06 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16z"/></svg>Code sent to your WhatsApp <strong>and</strong> email (x.hemmings@gmail.com)';
    } else if (channel === 'whatsapp') {
        hint.style.cssText = 'background:#f0fdf4;border-color:#bbf7d0;color:#166534;display:flex;align-items:center;gap:10px;border:1px solid;border-radius:9px;padding:12px 14px;margin-bottom:22px;font-size:.87rem';
        hint.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" fill="#22c55e"/></svg>A 6-digit code was sent to your WhatsApp.';
    } else {
        hint.style.cssText = 'background:#eff6ff;border-color:#bfdbfe;color:#1e40af;display:flex;align-items:center;gap:10px;border:1px solid;border-radius:9px;padding:12px 14px;margin-bottom:22px;font-size:.87rem';
        hint.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>A 6-digit code was sent to your email.';
    }
    document.getElementById('otp-input').focus();
}

function chooseMethod(method) {
    document.getElementById('step-method').style.display = 'none';
    if (method === 'password') {
        document.getElementById('step-password').style.display = 'block';
        document.getElementById('pwd-input').focus();
    } else {
        document.getElementById('step-otp').style.display = 'block';
        document.getElementById('otp-input').focus();
    }
}

async function submitPassword() {
    hideErr('pwd-error');
    const btn = document.getElementById('pwd-btn');
    btn.disabled=true; btn.textContent='Signing in…';
    const pwd = document.getElementById('pwd-input').value;
    try {
        const r = await fetch('/api/login/password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: pendingUsername, password: pwd }) });
        const d = await r.json();
        if (!r.ok) { showErr('pwd-error', d.error||'Incorrect password'); btn.disabled=false; btn.textContent='Login'; return; }
        window.location.href = d.role==='superadmin' ? '/users.html' : d.role==='admin' ? '/admin.html' : '/calendar.html';
    } catch { showErr('pwd-error','Network error.'); btn.disabled=false; btn.textContent='Login'; }
}

async function submitOtp() {
    hideErr('otp-error');
    const btn = document.getElementById('verify-btn');
    btn.disabled = true; btn.textContent = 'Verifying…';
    const otp = document.getElementById('otp-input').value.trim();
    try {
        const r = await fetch('/api/verify-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ otp }) });
        const d = await r.json();
        if (!r.ok) { showErr('otp-error', d.error || 'Verification failed'); btn.disabled=false; btn.textContent='Verify & Login'; return; }
        window.location.href = d.role === 'superadmin' ? '/users.html' : '/admin.html';
    } catch { showErr('otp-error', 'Network error.'); btn.disabled=false; btn.textContent='Verify & Login'; }
}

function backToUsername() {
    ['step-otp','step-method','step-password'].forEach(id => document.getElementById(id).style.display='none');
    document.getElementById('step-credentials').style.display='block';
    document.getElementById('login-btn').disabled=false;
    document.getElementById('login-btn').textContent='Send Verification Code';
    hideErr('otp-error'); hideErr('pwd-error');
    if(document.getElementById('pwd-input')) document.getElementById('pwd-input').value='';
}
</script>
</body>
</html>
